x-common: &common
  image: mxl-lab:latest
  env_file: .env
  environment:
    NDI_CONFIG_DIR: /config/ndi
  volumes:
    - ./config/ndi:/root/.ndi:ro
    - /dev/shm/mxl:/dev/shm/mxl
    - ./config:/config
    - ./scripts:/opt/scripts:ro
    - ./autoframe.py:/opt/autoframe.py:ro
    - /var/run/dbus:/var/run/dbus
    - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    - /etc/machine-id:/etc/machine-id:ro
    - preview:/preview
  # Docker's default AppArmor profile blocks D-Bus, which NDI needs to reach
  # avahi for mDNS discovery. Unconfined is fine on a lab VLAN.
  security_opt:
    - apparmor:unconfined
  shm_size: "1gb"
  # tini as process 1, so containers stop cleanly instead of being killed (exit 137)
  init: true
  cap_add:
    - SYS_NICE
  restart: unless-stopped

services:
  # Always created. Running only when discovery is set to "Server on this VM";
  # the GUI and scripts/ndi-mode.sh start and stop it.
  ndi-discovery:
    image: mxl-lab:latest
    container_name: mxl-ndi-discovery
    network_mode: host
    init: true
    volumes:
      - ./ndi:/opt/ndi:ro
    command: ["/opt/ndi/ndi-discovery-server"]
    restart: unless-stopped

  ndi-ingest:
    <<: *common
    build:
      context: .
      args:
        UBUNTU: ${UBUNTU_VERSION:-24.04}
    container_name: mxl-ndi-ingest
    network_mode: host
    command: ["/opt/scripts/run-ingest.sh"]

  # Minimal NDI-to-MXL adapter for integration with an external MXL Core.
  # Start only this service with:
  #   docker compose --profile ndi-core-ingress up -d ndi-core-ingress
  ndi-core-ingress:
    <<: *common
    profiles: ["ndi-core-ingress"]
    env_file: ${CORE_INGRESS_ENV_FILE:-env.core-ingress.example}
    build:
      context: .
      args:
        UBUNTU: ${UBUNTU_VERSION:-24.04}
    container_name: mxl-ndi-core-ingress
    network_mode: host
    command: ["/opt/scripts/run-ingest.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -d \"$${MXL_DOMAIN}/$${FLOW_A}.mxl-flow\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  autoframe:
    <<: *common
    container_name: mxl-autoframe
    depends_on:
      - ndi-ingest
    command: ["python3", "/opt/autoframe.py"]

  ndi-out-original:
    <<: *common
    container_name: mxl-ndi-out-original
    network_mode: host
    depends_on:
      - ndi-ingest
    command: ["/opt/scripts/run-out-original.sh"]

  ndi-out-vertical:
    <<: *common
    container_name: mxl-ndi-out-vertical
    network_mode: host
    depends_on:
      - autoframe
    command: ["/opt/scripts/run-out-vertical.sh"]

  # Reads the MXL audio flow and sends it as AES67 / ST 2110-30 multicast.
  # Idles when AES67 output is turned off in the GUI.
  aes67-out:
    image: mxl-lab:latest
    container_name: mxl-aes67-out
    env_file: .env
    network_mode: host
    depends_on:
      - ndi-ingest
    volumes:
      - /dev/shm/mxl:/dev/shm/mxl
      - ./config:/config
      - ./scripts:/opt/scripts:ro
      - preview:/preview
      - ptp-run:/run/ptp
    shm_size: "1gb"
    init: true
    cap_add:
      - SYS_NICE
    command: ["python3", "/opt/scripts/aes67_out.py"]
    restart: unless-stopped

  # ptp4l (and phc2sys with hardware timestamping). Shares the VM's kernel, so
  # it steers the VM's own clock, the one MXL and aes67-out run on.
  # Privileged for CAP_SYS_TIME and /dev/ptp*. Idles when PTP is off.
  ptp:
    image: mxl-lab:latest
    container_name: mxl-ptp
    network_mode: host
    privileged: true
    init: true
    volumes:
      - ./config:/config:ro
      - ./scripts:/opt/scripts:ro
      - ptp-run:/run/ptp
    command: ["python3", "/opt/scripts/run-ptp.py"]
    restart: unless-stopped

  gui:
    build: ./gui
    image: mxl-lab-gui:latest
    container_name: mxl-gui
    init: true
    env_file: .env
    environment:
      NDI_CONFIG_DIR: /config/ndi
    # host networking so NDI discovery (mDNS) works from inside the container
    network_mode: host
    volumes:
      - /dev/shm/mxl:/dev/shm/mxl
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gui:/opt/gui:ro
      - ./scripts:/opt/scripts:ro
      - ptp-run:/run/ptp
      - ./config/ndi:/root/.ndi:ro
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - /etc/machine-id:/etc/machine-id:ro
      - preview:/preview
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped

volumes:
  # Live preview frames from autoframe to the GUI. In memory, so the
  # frequent writes never touch the disk.
  preview:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m"
  # ptp4l's management socket, shared with the GUI and aes67-out for pmc
  ptp-run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m"
